name: Secrets Scope Practice

on:
  workflow_dispatch:

jobs:
  secrets-test:
    runs-on: ubuntu-latest

    env:
      MY_SECRET: ${{ secrets.MY_SECRET }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      - name: Step 1 - Job scope
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET is available"
          fi

          if [ -n "$API_TOKEN" ]; then
            echo "API_TOKEN is available"
          fi

      - name: Step 2 - Same job
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET is still available"
          fi

          if [ -n "$API_TOKEN" ]; then
            echo "API_TOKEN is still available"
          fi
