name: Secrets Scope Practice

on:
  workflow_dispatch:

jobs:
  secrets-test:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Step scope
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET is available"
          fi

          if [ -z "$API_TOKEN" ]; then
            echo "API_TOKEN is not available"
          fi

      - name: Step 2 - Different step
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "MY_SECRET is not available"
          fi

          if [ -z "$API_TOKEN" ]; then
            echo "API_TOKEN is not available"
          fi
