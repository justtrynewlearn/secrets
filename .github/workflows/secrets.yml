name: Secrets Scope Practice

on:
  workflow_dispatch:

jobs:
  secrets-test:
    runs-on: ubuntu-latest

    env:
      MY_SECRET: ${{ secrets.MY_SECRET }}

    steps:
      - name: Step 1 - Job value
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET exists in Step 1"
          fi

      - name: Step 2 - Override
        env:
          MY_SECRET: "step-value"
        run: |
          if [ "$MY_SECRET" = "step-value" ]; then
            echo "Step 2 uses its own value"
          fi

      - name: Step 3 - Back to job value
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET is available again"
          fi
