name: Secrets Basic

on:
  workflow_dispatch:

jobs:
  secrets-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "MY_SECRET is missing"
            exit 1
          fi

          echo "MY_SECRET is available"
